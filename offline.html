<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0B0D">
<title>Hors-ligne — Boîte à outils</title>
<style>
  :root{
    color-scheme: dark;
    --bg: #0A0B0D;
    --surface: #141518;
    --border: rgba(255,255,255,0.06);
    --border-strong: rgba(255,255,255,0.10);
    --text: #EDEEF0;
    --text-muted: #8A8F98;
    --text-subtle: #5C6169;
    --accent: #5E6AD2;
    --accent-soft: rgba(94,106,210,0.12);
    --accent-ring: rgba(94,106,210,0.35);
    --accent-glow: rgba(94,106,210,0.28);
    --accent-text: #8B96E8;
    --font-sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    line-height: 1.55;
    letter-spacing: -0.005em;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow: hidden;
  }
  /* Vignette lumineuse discrète */
  body::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(500px 300px at 30% 20%, rgba(94,106,210,0.10), transparent 65%),
      radial-gradient(400px 250px at 80% 80%, rgba(139,92,246,0.06), transparent 65%);
  }
  main{
    position: relative;
    max-width: 440px;
    width: 100%;
    padding: 40px 36px 32px;
    background: linear-gradient(180deg, #17181D 0%, #131418 100%);
    border-radius: 14px;
    box-shadow:
      inset 0 0 0 1px var(--border),
      0 20px 48px -12px rgba(0,0,0,0.6);
    animation: fadeIn .4s var(--ease-out);
  }
  /* Top highlight signature Linear */
  main::before{
    content: "";
    position: absolute;
    top: 0;
    left: 8%;
    right: 8%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent);
    pointer-events: none;
  }
  @keyframes fadeIn{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .status-dot{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font: 500 11.5px/1 var(--font-mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 20px;
  }
  .status-dot::before{
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: #F0B323;
    box-shadow: 0 0 0 4px rgba(240,179,35,0.15);
  }

  h1{
    margin: 0 0 12px;
    font: 700 1.5rem/1.2 'IBM Plex Sans Condensed', var(--font-sans);
    letter-spacing: -0.02em;
    color: var(--text);
  }
  h1 em{
    font-style: normal;
    color: var(--accent-text);
  }

  p{
    margin: 0 0 24px;
    color: var(--text-muted);
    font-size: 0.94rem;
    text-wrap: pretty;
  }

  button{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    background: linear-gradient(180deg, #6E7AE0 0%, #5E6AD2 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    font: 500 14px/1 var(--font-sans);
    letter-spacing: -0.005em;
    cursor: pointer;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.16),
      0 1px 2px rgba(0,0,0,0.4),
      0 6px 20px -4px var(--accent-glow);
    transition:
      transform .18s var(--ease-out),
      box-shadow .18s var(--ease-out),
      background .18s var(--ease-out);
  }
  button:hover{
    background: linear-gradient(180deg, #7A85E6 0%, #6B77DC 100%);
    transform: translateY(-1px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.20),
      0 1px 2px rgba(0,0,0,0.4),
      0 10px 28px -4px var(--accent-glow);
  }
  button:active{ transform: translateY(0); }
  button:focus-visible{
    outline: none;
    box-shadow: 0 0 0 3px var(--accent-ring);
  }
  button svg{
    width: 15px;
    height: 15px;
    flex: none;
  }
</style>
</head>
<body>
<main>
  <div class="status-dot">Hors-ligne</div>
  <h1>La page demandée n'est <em>pas disponible</em>.</h1>
  <p>Les démos et les pages d'installation sont hébergées sur d'autres sites et nécessitent une connexion réseau. Reconnectez-vous puis réessayez.</p>
  <button type="button" onclick="location.reload()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M23 4v6h-6M1 20v-6h6"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </svg>
    Réessayer
  </button>
</main>
</body>
</html>
