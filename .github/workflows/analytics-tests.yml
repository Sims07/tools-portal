name: GoatCounter regression tests

on:
  pull_request:
    paths:
      - 'analytics.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/analytics.test.cjs'
      - '.github/workflows/analytics-tests.yml'
  push:
    branches: [main]
    paths:
      - 'analytics.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/analytics.test.cjs'
      - '.github/workflows/analytics-tests.yml'

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test GoatCounter tracking without external dependencies
        run: node --test tests/analytics.test.cjs
