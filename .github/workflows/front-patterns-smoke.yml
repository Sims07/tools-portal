name: Smoke tests — Portail
on:
  pull_request:
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'analytics.js'
      - 'tests/front-patterns.test.mjs'
      - '.github/workflows/front-patterns-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'analytics.js'
      - 'tests/front-patterns.test.mjs'
      - '.github/workflows/front-patterns-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/front-patterns.test.mjs
